services:
  # -------------------------
  # Composer cho svc-auth
  # -------------------------
  auth-composer:
    image: composer:2
    working_dir: /app
    command: ["composer", "install", "--no-interaction", "--prefer-dist"]
    volumes:
      - ./services/svc-auth:/app
      - vendor_auth:/app/vendor
      - composer-cache:/tmp/cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/cache
    restart: "no"
    networks: ["backend"]

  # -------------------------
  # PHP-FPM (svc-auth)
  # -------------------------
  auth-app:
    build: ./services/svc-auth
    container_name: auth-app
    env_file: ./services/svc-auth/.env
    working_dir: /var/www/html
    volumes:
      - ./services/svc-auth:/var/www/html:rw
      - vendor_auth:/var/www/html/vendor
      - storage_auth:/var/www/html/storage
      - cache_auth:/var/www/html/bootstrap/cache
    expose: ["9000"]
    depends_on:
      auth-composer:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_started
    healthcheck:
      test: >
        [ -f vendor/autoload.php ] &&
        php-fpm -tt >/dev/null 2>&1 &&
        php -r 'exit(!@fsockopen("127.0.0.1",9000));'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: ["backend"]

  # -------------------------
  # Nginx (svc-auth)
  # -------------------------
  auth-nginx:
    image: nginx:stable
    container_name: auth-nginx
    volumes:
      - ./services/svc-auth:/var/www/html:ro
      - ./services/svc-auth/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    depends_on:
      auth-app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nginx -t && (echo > /dev/tcp/127.0.0.1/80) >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  # -------------------------
  # MySQL (svc-auth)
  # -------------------------
  auth-db:
    image: mysql:8
    container_name: auth-db
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth
      MYSQL_PASSWORD: auth
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33061:3306"
    volumes:
      - auth-dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  # -------------------------
  # Redis
  # -------------------------
  auth-redis:
    image: redis:7
    container_name: redis
    ports:
      - "6381:6379"
    restart: unless-stopped
    networks: [backend]

# -------------------------
# Volumes
# -------------------------
volumes:
  composer-cache:

  auth-dbdata:
  vendor_auth:
  storage_auth:
  cache_auth:

# -------------------------
# Network
# -------------------------
networks:
  backend:
    driver: bridge
